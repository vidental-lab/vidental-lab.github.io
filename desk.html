<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex, nofollow">
<title>Vidental Lab Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one narrow working column, tab strip on top, lists as rows not cards. Tokens from the lab's own teal, navy and gold. */
:root{
  --bg:#E6EFED; --surface:#FFFFFF; --ink:#151132; --muted:#5B6270; --line:#D3E0DD;
  --teal:#1B6A60; --teal-soft:#D5EBE7; --gold:#9A7A1E; --gold-soft:#F6EBC8;
  --danger:#B3382C; --danger-soft:#F8DDD8; --good:#1E7A4D; --good-soft:#D7EEDF;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A19; --surface:#162624; --ink:#E7F0EE; --muted:#97AAA6; --line:#2A3F3C;
    --teal:#63C7B8; --teal-soft:#1D3A36; --gold:#DDBB5E; --gold-soft:#3A3217;
    --danger:#F18C80; --danger-soft:#44221E; --good:#70D09C; --good-soft:#1B3A2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A19; --surface:#162624; --ink:#E7F0EE; --muted:#97AAA6; --line:#2A3F3C;
  --teal:#63C7B8; --teal-soft:#1D3A36; --gold:#DDBB5E; --gold-soft:#3A3217;
  --danger:#F18C80; --danger-soft:#44221E; --good:#70D09C; --good-soft:#1B3A2A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 60px}
.app{max-width:960px;margin-inline:auto}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header.top img{width:52px;height:52px;border-radius:50%;flex:none}
header.top h1{font-family:var(--font-display);font-size:1.6rem;line-height:1.1;margin:0;font-weight:600;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:none;background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--teal-soft);color:var(--teal)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h2{font-family:var(--font-display);font-size:1.35rem;margin:0 0 4px;font-weight:600}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 8px;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-family:var(--font-display);font-size:1.9rem;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .n{font-size:.85rem;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1 1 200px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;min-width:80px;text-align:right}
.empty{padding:22px 16px;color:var(--muted)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.03em}
.pill.paid,.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.unpaid{background:var(--gold-soft);color:var(--gold)}
.pill.overdue,.pill.low{background:var(--danger-soft);color:var(--danger)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#06201C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#06201C}}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.small{padding:5px 11px;font-size:.85rem;border-radius:8px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{font:inherit;font-weight:600;font-size:.85rem;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
.lines{margin-top:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 90px 36px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line.head{border-top:0;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding-bottom:2px}
.line .lt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.line .x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;border-radius:8px}
.line .x:hover{color:var(--danger)}
@media (max-width:640px){
  .line{grid-template-columns:64px 100px 1fr;grid-template-areas:"d d x" "q p t"}
  .line .d{grid-area:d}.line .q{grid-area:q}.line .p{grid-area:p}.line .lt{grid-area:t}.line .x{grid-area:x}
  .line.head{display:none}
}
.total{display:flex;justify-content:flex-end;gap:16px;align-items:baseline;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.total b{font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted)}
.banner{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
.adj{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.adj>div{flex:1 1 110px}
.pickrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pickrow select{flex:1 1 240px}
.num{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,20,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:10}
.modal .panel{max-width:620px;width:100%}
.view-table{width:100%;border-collapse:collapse;margin-top:10px}
.view-table td,.view-table th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.view-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:0}
.view-table td:last-child,.view-table th:last-child{text-align:right}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>


</head><body>
<script>window.VDESK_STANDALONE=true;
(function(){
  var KEY='vidental-desk-data-v1', mem=null, persistent=true;
  var data={}, listeners=[];
  function load(){try{var t=localStorage.getItem(KEY);if(t)data=JSON.parse(t)||{}}catch(e){persistent=false}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){persistent=false}}
  load();
  if(!data.__seeded){
    data.__seeded=true;
    data.stock={
      resin:{name:'Printed model resin',qty:1,unit:'kg',min:0.5,cost:50,supplier:'',note:'Example quantity. Edit to your real stock.'},
      'special-tray':{name:'Special tray material',qty:50,unit:'pcs',min:10,cost:2.2,supplier:'',note:'Example quantity. Edit to your real stock.'},
      'lab-bags':{name:'Lab bags with pocket',qty:50,unit:'pcs',min:20,cost:'',supplier:'',note:'Example quantity. Edit to your real stock.'}};
    save();
  }
  function uid(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function notifyAll(){listeners.slice().forEach(function(l){l()})}
  function snapDoc(c,id){var d=(data[c]||{})[id];return {id:id,exists:!!d,data:function(){return d?clone(d):undefined}}}
  function collQuery(c,opts){
    var q={
      orderBy:function(f,dir){return collQuery(c,Object.assign({},opts,{f:f,dir:dir||'asc'}))},
      limit:function(n){return collQuery(c,Object.assign({},opts,{n:n}))},
      get:async function(){return build()},
      onSnapshot:function(cb){var run=function(){cb(build())};listeners.push(run);setTimeout(run,0);return function(){listeners=listeners.filter(function(x){return x!==run})}}
    };
    function build(){
      var ids=Object.keys(data[c]||{});var docs=ids.map(function(id){return snapDoc(c,id)});
      if(opts.f){docs.sort(function(a,b){var x=a.data()[opts.f],y=b.data()[opts.f];if(x===y)return 0;var r=x>y?1:-1;return opts.dir==='desc'?-r:r})}
      if(opts.n)docs=docs.slice(0,opts.n);
      return {docs:docs,size:docs.length,empty:!docs.length}
    }
    return q}
  function docRef(c,id){return {
    id:id,
    get:async function(){return snapDoc(c,id)},
    set:async function(d){(data[c]=data[c]||{})[id]=clone(d);save();notifyAll()},
    update:async function(d){var cur=(data[c]||{})[id];if(!cur)throw {code:'invalid_argument',message:'Document does not exist'};Object.assign(cur,clone(d));save();notifyAll()},
    delete:async function(){if(data[c]){delete data[c][id];save();notifyAll()}},
    onSnapshot:function(cb){var run=function(){cb(snapDoc(c,id))};listeners.push(run);setTimeout(run,0);return function(){listeners=listeners.filter(function(x){return x!==run})}}
  }}
  var db={
    collection:function(c){var q=collQuery(c,{});q.doc=function(id){return docRef(c,id||uid())};q.add=async function(d){var r=docRef(c,uid());await r.set(d);return r};return q},
    doc:function(p){var i=p.indexOf('/');return docRef(p.slice(0,i),p.slice(i+1))}
  };
  var downloads={save:async function(req){
    var name=req.filename,d=req.data,type=/\.pdf$/i.test(name)?'application/pdf':/\.json$/i.test(name)?'application/json':'application/octet-stream';
    var blob=d instanceof Blob?d:new Blob([d],{type:type});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return {status:'saved'}}};
  window.claude={use:async function(n){return n==='db'?db:n==='downloads'?downloads:null}};
  // backup & restore panel in Settings
  window.vdeskBackupPanel=function(){return '<h3>Backup</h3><div class="panel"><p class="note" style="margin-top:0">Your data is saved in this browser on this device only. Download a backup regularly, and use it to move to another computer.</p><div class="actions"><button class="btn" data-act="backup">Download backup</button><label class="btn ghost" for="r-file" style="margin:0;cursor:pointer">Restore from backup</label><input id="r-file" type="file" accept=".json,application/json" hidden></div>'+(persistent?'':'<p class="note" style="color:var(--danger)">This browser is blocking storage, so data will be lost when you close the page.</p>')+'</div>'};
  document.addEventListener('click',function(e){var b=e.target.closest('[data-act="backup"]');if(!b)return;
    var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    downloads.save({filename:'vidental-desk-backup-'+ds+'.json',data:JSON.stringify(data,null,1)})});
  document.addEventListener('change',function(e){if(!e.target||e.target.id!=='r-file')return;var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(typeof o!=='object'||!o)throw 0;data=o;data.__seeded=true;save();notifyAll();
      document.getElementById('banner').innerHTML='<div class="banner">Backup restored.</div>';setTimeout(function(){document.getElementById('banner').innerHTML=''},3000)}
      catch(x){document.getElementById('banner').innerHTML='<div class="banner">That file is not a valid backup.</div>'}};r.readAsText(f)});
  if(!persistent)document.addEventListener('DOMContentLoaded',function(){document.getElementById('banner').innerHTML='<div class="banner">This browser is blocking storage, so your data will not be kept after you close the page.</div>'});
})();
</script>

var db=null, downloads=null;
var S={practices:[],invoices:[],stock:[],logs:[],settings:Object.assign({},DEFAULT_SETTINGS),loaded:{}};
var tab='home', invFilter='unpaid', draft=null, openAdj=null, confirmKey=null, confirmTimer=null;

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){n=Number(n)||0;return '$'+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '';var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function daysBetween(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000)}
function toast(msg){var r=$('#toast-root');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){r.innerHTML=''},2600)}
function invSub(inv){return (inv.lines||[]).reduce(function(a,l){return a+(Number(l.qty)||0)*(Number(l.price)||0)},0)}
function invDisc(inv){var d=Math.min(100,Math.max(0,Number(inv.discount)||0));return Math.round(invSub(inv)*d)/100}
function invTotal(inv){return invSub(inv)-invDisc(inv)}
function isOverdue(inv){return inv.status!=='paid'&&inv.dueDate&&inv.dueDate<todayStr()}
function byNumber(a,b){return (b.seq||0)-(a.seq||0)}
function nextSeq(){var m=999;S.invoices.forEach(function(i){if((i.seq||0)>m)m=i.seq});return m+1}
function cfg(){return Object.assign({},DEFAULT_SETTINGS,S.settings)}
function guardDb(){if(!db){toast('Sign in to claude.ai to save your data.');return false}return true}
function fail(e){toast('Could not save: '+(e&&e.message?e.message:'try again'))}

/* ---------- navigation ---------- */
function setTab(t){tab=t;editingPractice=null;editingStock=null;openAdj=null;try{localStorage.setItem('vdesk-tab',t)}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});
  render();window.scrollTo(0,0)}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(b){if(b.dataset.tab==='new'&&!draft)draft=newDraft();setTab(b.dataset.tab)}});

/* ---------- views ---------- */
function render(){
  var v=$('#view');
  if(tab==='home')v.innerHTML=viewHome();
  else if(tab==='invoices')v.innerHTML=viewInvoices();
  else if(tab==='new'){if(!draft)draft=newDraft();v.innerHTML=viewBuilder();bindBuilder()}
  else if(tab==='practices')v.innerHTML=viewPractices();
  else if(tab==='stock')v.innerHTML=viewStock();
  else if(tab==='settings'){v.innerHTML=viewSettings()}
}

function viewHome(){
  var unpaid=S.invoices.filter(function(i){return i.status!=='paid'});
  var owing=unpaid.reduce(function(a,i){return a+invTotal(i)},0);
  var overdue=unpaid.filter(isOverdue);
  var ym=todayStr().slice(0,7);
  var paidMonth=S.invoices.filter(function(i){return i.status==='paid'&&(i.paidDate||'').slice(0,7)===ym}).reduce(function(a,i){return a+invTotal(i)},0);
  var low=S.stock.filter(function(s){return Number(s.qty)<=Number(s.min)});
  var h='<h2>Overview</h2><p class="sub">What is owed, and what is running low.</p><div class="stats">';
  h+='<div class="stat"><div class="k">Owed to you</div><div class="v">'+money(owing)+'</div><div class="n">'+unpaid.length+' unpaid invoice'+(unpaid.length===1?'':'s')+(overdue.length?' · '+overdue.length+' overdue':'')+'</div></div>';
  h+='<div class="stat"><div class="k">Paid this month</div><div class="v">'+money(paidMonth)+'</div><div class="n">By paid date</div></div>';
  h+='<div class="stat"><div class="k">Low stock</div><div class="v">'+low.length+'</div><div class="n">'+(low.length?'Items at or below minimum':'Everything above minimum')+'</div></div></div>';
  h+='<h3>Unpaid invoices</h3><div class="list">';
  if(!unpaid.length)h+='<div class="empty">'+(S.loaded.invoices?'Nothing unpaid. New invoices will show here until you mark them paid.':'Loading…')+'</div>';
  unpaid.slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1}).slice(0,8).forEach(function(i){
    var od=isOverdue(i);

  var c=cfg();var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});var W=210,M=18,y=18;
  var ink=[21,17,50],teal=[27,106,96],grey=[107,107,120],line=[211,224,221];
  try{doc.addImage(LOGO,'PNG',M,y-2,24,24)}catch(e){}
  doc.setTextColor.apply(doc,ink);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text(c.bizName,M+29,y+8);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor.apply(doc,grey);
  doc.text([c.place,'ABN '+c.abn,c.phone+'  ·  '+c.email],M+29,y+14);
  doc.setFont('helvetica','bold');doc.setFontSize(26);doc.setTextColor.apply(doc,teal);doc.text('INVOICE',W-M,y+9,{align:'right'});
  y=52;doc.setDrawColor.apply(doc,line);doc.line(M,y-6,W-M,y-6);
  doc.setFontSize(8.5);doc.setTextColor.apply(doc,grey);doc.setFont('helvetica','bold');
  doc.text('BILL TO',M,y);doc.text('INVOICE NO.',110,y);doc.text('DATE',140,y);doc.text('DUE',168,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor.apply(doc,ink);
  var billTo=[inv.practiceName].concat(inv.practiceContact?[inv.practiceContact]:[]).concat(inv.practiceAddress?doc.splitTextToSize(inv.practiceAddress,80):[]);
  doc.setFont('helvetica','bold');doc.text(billTo[0],M,y+6);doc.setFont('helvetica','normal');doc.text(billTo.slice(1),M,y+11.5);
  doc.text(inv.number,110,y+6);doc.text(fmtDate(inv.date),140,y+6);doc.text(inv.dueDate?fmtDate(inv.dueDate):'—',168,y+6);
  if(inv.ref){doc.setFontSize(9);doc.setTextColor.apply(doc,grey);doc.text('Ref: '+inv.ref,110,y+12)}
  y=Math.max(y+11.5+billTo.slice(1).length*5,y+22)+8;
  doc.setFillColor(213,235,231);doc.rect(M,y,W-2*M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor.apply(doc,teal);
  doc.text('DESCRIPTION',M+3,y+5.4);doc.text('QTY',W-M-66,y+5.4,{align:'right'});doc.text('PRICE',W-M-38,y+5.4,{align:'right'});doc.text('AMOUNT',W-M-3,y+5.4,{align:'right'});
  y+=8;doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor.apply(doc,ink);
  inv.lines.forEach(function(l){var d=doc.splitTextToSize(l.desc,W-2*M-80);var h=Math.max(8,d.length*5+3);
    if(y+h>265){doc.addPage();y=20}
    doc.text(d,M+3,y+5.4);doc.text(String(l.qty),W-M-66,y+5.4,{align:'right'});doc.text(money(l.price),W-M-38,y+5.4,{align:'right'});doc.text(money(l.qty*l.price),W-M-3,y+5.4,{align:'right'});
    doc.setDrawColor.apply(doc,line);doc.line(M,y+h,W-M,y+h);y+=h});
  y+=6;var dsc=invDisc(inv);if(dsc>0){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor.apply(doc,ink);doc.text('Subtotal',W-M-70,y+1);doc.text(money(invSub(inv)),W-M-3,y+1,{align:'right'});y+=6;doc.text('Discount ('+inv.discount+'%)',W-M-70,y+1);doc.text('-'+money(dsc),W-M-3,y+1,{align:'right'});y+=7}doc.setDrawColor.apply(doc,ink);doc.setLineWidth(.5);doc.line(W-M-70,y,W-M,y);doc.setLineWidth(.2);
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('TOTAL (AUD)',W-M-70,y+7);doc.setFontSize(15);doc.text(money(invTotal(inv)),W-M-3,y+7.5,{align:'right'});
  y+=20;if(y>240){doc.addPage();y=22}
  var pay=[];if(c.accName)pay.push('Account name: '+c.accName);if(c.bsb)pay.push('BSB: '+c.bsb);if(c.accNo)pay.push('Account number: '+c.accNo);
  doc.setFontSize(8.5);doc.setTextColor.apply(doc,grey);doc.text('PAYMENT DETAILS',M,y);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor.apply(doc,ink);
  if(pay.length){doc.text(pay,M,y+6);doc.text('Reference: '+inv.number,M,y+6+pay.length*5)}else{doc.setTextColor.apply(doc,grey);doc.text('Add your bank details in Settings.',M,y+6)}
  var tx=y+6+(pay.length?(pay.length+1)*5:6)+4;doc.setTextColor.apply(doc,ink);
  if(c.terms){doc.setFontSize(9.5);doc.text('Payment terms: '+c.terms+' days.',M,tx);tx+=5}
  if(inv.notes){doc.setFontSize(9.5);doc.setTextColor.apply(doc,grey);doc.text(doc.splitTextToSize(inv.notes,W-2*M),M,tx);tx+=10}
  doc.setFontSize(9.5);doc.setTextColor.apply(doc,teal);doc.setFont('helvetica','bold');doc.text(c.footer||'',W/2,285,{align:'center'});
  try{await downloads.save({filename:inv.number+' - '+inv.practiceName.replace(/[^\w\- ]+/g,'').trim()+'.pdf',data:doc.output('arraybuffer')});toast('PDF ready')}
  catch(e){if(e&&e.code!=='declined')toast('Could not save the PDF.')}}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var f=e.target.closest('[data-filter]');if(f){invFilter=f.dataset.filter;render();return}
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.dataset.act,id=el.dataset.id;
  if(act==='close-modal'){if(e.target===el)closeModal();return}
  if(act==='close-modal-btn'){closeModal();return}
  if(act==='disc'){draft.discount=Number(el.dataset.v)||0;var fd=$('#f-disc');if(fd)fd.value=draft.discount||'';updateTotal();return}
  if(act==='new-invoice'){draft=newDraft();setTab('new');return}
  if(act==='open-invoice'){modalId=id;openInvoice(id);return}
  if(act==='add-custom'){draft.lines.push({desc:'',qty:1,price:''});renderLines();var k=draft.lines.length-1;var inp=$('#l-d-'+k);if(inp)inp.focus();return}
  if(act==='rm-line'){draft.lines.splice(+el.dataset.i,1);renderLines();return}
  if(act==='save-invoice'){saveInvoice(false);return}
  if(act==='save-invoice-pdf'){saveInvoice(true);return}
  if(act==='cancel-edit'){draft=null;setTab('invoices');return}
  if(act==='edit-invoice'){var i=S.invoices.filter(function(x){return x.id===id})[0];if(i){draft={id:i.id,seq:i.seq,practiceId:i.practiceId,date:i.date,dueDate:i.dueDate||'',ref:i.ref||'',notes:i.notes||'',lines:(i.lines||[]).map(function(l){return Object.assign({},l)}),status:i.status,paidDate:i.paidDate||'',createdAt:i.createdAt,discount:i.discount||0};closeModal();setTab('new')}return}
  if(act==='mark-paid'&&guardDb()){db.doc('invoices/'+id).update({status:'paid',paidDate:todayStr()}).then(function(){toast('Marked paid')},fail);return}
  if(act==='mark-unpaid'&&guardDb()){db.doc('invoices/'+id).update({status:'unpaid',paidDate:''}).then(function(){toast('Marked unpaid')},fail);return}
  if(act==='pdf'){var inv=S.invoices.filter(function(x){return x.id===id})[0];if(inv)downloadPdf(inv);return}
  if(act==='del-invoice'){if(confirmKey==='i'+id){confirmKey=null;if(guardDb())db.doc('invoices/'+id).delete().then(function(){closeModal();toast('Invoice deleted')},fail)}else{arm('i'+id);openInvoice(id)}return}
  if(act==='save-practice'){savePractice();return}
  if(act==='cancel-practice'){fillPracticeForm(null);return}
  if(act==='edit-practice'){fillPracticeForm(S.practices.filter(function(x){return x.id===id})[0]);window.scrollTo(0,0);return}
  if(act==='del-practice'){if(confirmKey==='p'+id){confirmKey=null;if(guardDb())db.doc('practices/'+id).delete().then(function(){toast('Practice deleted')},fail)}else{arm('p'+id);render()}return}
  if(act==='save-stock'){saveStock();return}
  if(act==='cancel-stock'){fillStockForm(null);return}
  if(act==='edit-stock'){fillStockForm(S.stock.filter(function(x){return x.id===id})[0]);window.scrollTo(0,0);return}
  if(act==='del-stock'){var sid=editingStock&&editingStock.id;if(!sid)return;if(confirmKey==='s'+sid){confirmKey=null;if(guardDb())db.doc('stock/'+sid).delete().then(function(){editingStock=null;toast('Item deleted')},fail)}else{arm('s'+sid);fillStockForm(editingStock)}return}
  if(act==='adj'){openAdj={id:id,dir:el.dataset.dir};render();var q=$('#a-qty');if(q)q.focus();return}
  if(act==='adj-cancel'){openAdj=null;render();return}
  if(act==='adj-save'){saveAdjust();return}
  if(act==='save-settings'){saveSettings();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('[data-act="open-invoice"]'))e.target.click();if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
function arm(k){confirmKey=k;clearTimeout(confirmTimer);confirmTimer=setTimeout(function(){confirmKey=null;render();refreshModal()},3500)}

/* ---------- data ---------- */
function snap(name,key,sort){return function(q){S[key]=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.loaded[key]=true;
  if(tab==='new'){fillPracticeSelect()}
  else if(tab==='practices'){var f=$('#pform');var keep=editingPractice;var typing=f&&f.contains(document.activeElement);if(!typing){render()}}
  else if(tab==='stock'){var sf=$('#sform');var typing2=sf&&sf.contains(document.activeElement);var ad=$('.adj');var typing3=ad&&ad.contains(document.activeElement);if(!typing2&&!typing3)render()}
  else if(tab!=='settings')render();
  refreshModal()}}
async function init(){
  var saved='';try{saved=localStorage.getItem('vdesk-tab')||''}catch(e){}
  if(['home','invoices','practices','stock','settings'].indexOf(saved)>-1)tab=saved;
  setTab(tab);
  try{db=await window.claude.use('db')}catch(e){db=null}
  try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
  if(!db){$('#banner').innerHTML='<div class="banner">Your data could not be loaded. Open this page while signed in to claude.ai.</div>';return}
  var err=function(){$('#banner').innerHTML='<div class="banner">Lost the connection to your saved data. Reload the page to try again.</div>'};
  db.collection('practices').onSnapshot(snap('practices','practices'),err);
  db.collection('invoices').onSnapshot(snap('invoices','invoices'),err);
  db.collection('stock').onSnapshot(snap('stock','stock'),err);
  db.collection('stocklog').orderBy('at','desc').limit(60).onSnapshot(function(q){S.logs=q.docs.map(function(d){return d.data()});if(tab==='stock'&&!(openAdj)){var sf=$('#sform');if(!(sf&&sf.contains(document.activeElement)))render()}},err);
  db.doc('settings/lab').onSnapshot(function(d){S.settings=Object.assign({},DEFAULT_SETTINGS,d.exists?d.data():{});var sv=$('#view');if(tab==='home'||tab==='invoices')render();else if(tab==='settings'&&!(sv&&sv.contains(document.activeElement)))render()},err);
}
init();
})();
</script>
